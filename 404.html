<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — Vitarex</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--navy-950); }
  .error-page {
    min-height: 100vh; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .error-page__content { position: relative; z-index: 1; max-width: 480px; }
  .error-page__brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; color: #fff; font-family: 'Space Grotesk', sans-serif; margin-bottom: 42px; }
  .error-page__brand svg { width: 20px; height: 20px; color: var(--cyan-400); }
  .error-page__code {
    font-family: 'Space Grotesk', sans-serif; font-size: 96px; font-weight: 700; line-height: 1;
    background: var(--gradient-brand); -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 10px;
  }
  .error-page__title { color: #fff; font-size: 22px; margin-bottom: 10px; }
  .error-page__text { color: rgba(255,255,255,0.6); font-size: 14.5px; margin-bottom: 32px; }
  .error-page__text small { display: block; margin-top: 4px; color: rgba(255,255,255,0.4); }
  .error-page__lang { position: absolute; top: 24px; right: 24px; z-index: 2; }
</style>
</head>
<body>

<div class="error-page">
  <div class="hero__bg" aria-hidden="true">
    <div class="mesh mesh--1"></div>
    <div class="mesh mesh--2"></div>
    <div class="grain"></div>
  </div>

  <div class="lang-switch error-page__lang" role="group" aria-label="Language">
    <button type="button" class="lang-btn" data-lang="ru">RU</button>
    <button type="button" class="lang-btn" data-lang="uz">UZ</button>
  </div>

  <div class="error-page__content">
    <a href="/" class="error-page__brand">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8c-4.2 5.1-7.2 8.9-7.2 12.7a7.2 7.2 0 0 0 14.4 0c0-3.8-3-7.6-7.2-12.7Z"/></svg>
      VITAREX
    </a>
    <div class="error-page__code">404</div>
    <h1 class="error-page__title" data-t="title">Страница не найдена</h1>
    <p class="error-page__text" data-t="text">Такой страницы не существует или она была перемещена.</p>
    <a href="/" class="btn btn--primary" data-t="btn">На главную</a>
  </div>
</div>

<script>
  (function () {
    var DICT = {
      ru: { title: "Страница не найдена", text: "Такой страницы не существует или она была перемещена.", btn: "На главную" },
      uz: { title: "Sahifa topilmadi", text: "Bunday sahifa mavjud emas yoki ko'chirilgan.", btn: "Bosh sahifaga" },
    };

    function safeGet() {
      try { return localStorage.getItem("vitarex_lang"); } catch (e) { return null; }
    }
    function safeSet(v) {
      try { localStorage.setItem("vitarex_lang", v); } catch (e) {}
    }

    function setLang(lang) {
      var dict = DICT[lang];
      document.querySelectorAll("[data-t]").forEach(function (el) {
        el.textContent = dict[el.getAttribute("data-t")];
      });
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      document.documentElement.lang = lang;
      safeSet(lang);
    }

    document.querySelectorAll(".lang-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { setLang(btn.dataset.lang); });
    });

    setLang(safeGet() === "uz" ? "uz" : "ru");
  })();
</script>
</body>
</html>
